# Judge0 settings. CHANGE the passwords/token; JUDGE0_AUTH_TOKEN must equal the app's JUDGE0_AUTH_TOKEN.
AUTHN_HEADER=X-Auth-Token
AUTHN_TOKEN=change-me-judge0-token
REDIS_HOST=judge0-redis
REDIS_PASSWORD=change-me-redis
POSTGRES_HOST=judge0-db
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=change-me-judge0-db
# sandbox hardening: no network from submitted code, sane limits
ENABLE_NETWORK=false
ALLOW_ENABLE_NETWORK=false
MAX_CPU_TIME_LIMIT=15
MAX_WALL_TIME_LIMIT=30
MAX_MEMORY_LIMIT=256000
MAX_PROCESSES_AND_OR_THREADS=60
MAX_MAX_FILE_SIZE=4096
